name: CI

on:
  # F-32 (2026-09-02): a task-branch push must produce a run. `branches: [main]`
  # meant "push each task's commit as it lands" bought zero CI coverage for three
  # sessions — be78f19 had no run at all, not an unread one. Every push is now
  # judged; the concurrency group below keeps a stack of pushes to the same
  # branch from piling up runs.
  push:
    branches: ['**']
  pull_request:
  # E-09 asks for a NIGHTLY re-render. It also runs on every PR, which is
  # strictly stronger, but the schedule is kept: a nightly run catches drift
  # that arrives from outside the repository - a dependency republished under
  # the same range, or a runner image with different ICU data - on a day when
  # nobody pushed anything.
  schedule:
    - cron: '17 6 * * *'

# Only the latest push to a branch matters; older runs for the same ref are
# cancelled rather than queued. The nightly schedule shares one group and never
# collides with itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # A real Postgres, never a mock. RLS fails silently — a SELECT returns
    # empty rather than raising — so a mock that returns what the test expects
    # proves nothing at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rms
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rms"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:55432/rms
      DATABASE_URL: postgresql://app_user:app_user_dev_only@localhost:55432/rms

    steps:
      - uses: actions/checkout@v4

      # D-20 / NFR-SEC-06. A pinned gitleaks binary, checksum-verified against
      # the release's own checksums file, scanning the working tree. Fails the
      # build on a detected secret. Proven to fire by T-11: a planted fake
      # credential turned this step red, and its removal turned it green.
      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact

      # Version comes from "packageManager" in package.json (pnpm@11.22.0).
      # Pinning "version: 11" here made the action fail with
      # "Multiple versions of pnpm specified" — the first CI run ever (2026-09-01)
      # died on this step before a single test executed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply migrations
        run: pnpm migrate

      - name: Unit and tenancy tests
        run: pnpm test

      # The self-test runs BEFORE the checker. A checker that silently stopped
      # working would otherwise report a clean pass forever.
      - name: Boundary checker self-test
        run: pnpm check:boundaries:selftest

      - name: Boundary check
        run: pnpm check:boundaries

      # The client bundle must not be able to import internal code. Two
      # applications is only a guarantee if the separation is enforced.
      - name: App boundary self-test
        run: pnpm check:apps:selftest

      - name: App boundary check
        run: pnpm check:apps

      # Same reasoning as the boundary self-test: prove the provenance lint
      # still catches a formatter applied to a raw value before trusting it.
      - name: Provenance lint self-test
        run: pnpm lint:provenance:selftest

      - name: Provenance lint
        run: pnpm lint:provenance

      # The product must not claim more than the design delivers. "tamper-proof"
      # is the phrase this exists for: the chain gives tamper EVIDENCE, and a
      # button label saying otherwise is a claim we would have to withdraw in
      # front of the person who relied on it. Self-test first, as always.
      - name: Language discipline self-test
        run: pnpm check:language:selftest

      - name: Language discipline check
        run: pnpm check:language

      # A catalog release records a content_sha256 that, until 2026-09-01,
      # nothing recomputed - and whose METHOD silently differed between the two
      # releases sitting in the same directory (F-19). Each manifest now
      # declares its method and this recomputes by it, failing closed on any
      # method it does not implement.
      - name: Content-hash checker self-test
        run: pnpm check:contenthash:selftest

      - name: Catalog content hashes match their declared method
        run: pnpm check:contenthash

      # approveRelease reads human_spot_checks and never compares it to the
      # pinned draw it is supposed to answer. A signature over a DIFFERENT set
      # of cells would pass every other gate (F-14, as restated).
      - name: Spot-check record checker self-test
        run: pnpm check:spotrecord:selftest

      - name: Signed spot-checks cover their pinned draw
        run: pnpm check:spotrecord

      # A workspace dependency that never reached the lockfile fails
      # `pnpm install --frozen-lockfile` above — this says WHICH one, and says
      # it in an environment where pnpm may not be installed at all.
      - name: Lockfile checker self-test
        run: pnpm check:lockfile:selftest

      - name: Workspace dependencies are recorded in the lockfile
        run: pnpm check:lockfile

      - name: Spot-check draw agreement (tool vs kernel)
        run: pnpm check:draw:selftest

      - name: RLS sensitivity checker self-test
        run: pnpm check:rls:selftest

      - name: RLS coverage assertion
        run: pnpm check:rls

      # E-09 / AC-12. The self-test runs first for the usual reason, and it
      # matters most here: a broken hash comparison fails GREEN, so this check
      # would certify byte-identical regeneration forever while comparing
      # nothing at all.
      - name: Determinism self-test
        run: pnpm check:determinism:selftest

      - name: Determinism check
        run: pnpm check:determinism

      # The scoreboard lives in two files - tasks/progress.md holds the arithmetic,
      # tasks/progress.html is the source of the published page. Two copies of the
      # same numbers drift; this re-derives them from both and fails if they differ.
      # Self-test first: a comparison that stopped comparing would pass forever.
      - name: Scoreboard sync self-test
        run: pnpm check:scoreboard:selftest

      - name: Scoreboard copies agree
        run: pnpm check:scoreboard

      # Sync proves the two copies agree with each other. It cannot tell whether
      # either one agrees with the repository, and two copies of a stale number
      # agree perfectly. check-claims re-derives the declared figures from the
      # working tree - and refuses to pass if a claim's pattern stopped matching,
      # because a claim nobody checks reads exactly like a claim that holds.
      - name: Stated-figure claims self-test
        run: pnpm check:claims:selftest

      - name: Stated figures match the repository
        run: pnpm check:claims

      - name: Kernel coverage gate
        run: pnpm coverage

      # §5.4's first two budgets. The other three need the server and the job
      # queue and are not claimed. Its own step, not folded into `test`: a
      # benchmark inside the normal suite is either slow every run or skipped
      # every run, and the skipped kind is why these budgets went unmeasured
      # for the life of the project.
      - name: Performance budgets (§5.4, budgets 1 and 2)
        run: pnpm bench

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Rebuilds the blueprint from src/parts and runs its 11 structural checks.
      # A drifted build artifact fails here rather than in someone's inbox.
      - name: Build and verify the blueprint
        run: python src/build.py

      - name: Fail if the built blueprint is not up to date with its source
        run: git diff --exit-code -- rack-master-studio-blueprint.html
